name: KVS Maintenance Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

# Prevent overlapping workflow runs from modifying the state together.
concurrency:
  group: kvs-maintenance-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check website
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check.py

      - name: Save state
        run: |
          # git status --porcelain (unlike git diff) also reports
          # brand-new untracked files, so this correctly catches the
          # very first run when maintenance_state.txt doesn't exist
          # in the repo yet.
          if [ -z "$(git status --porcelain -- maintenance_state.txt)" ]; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add maintenance_state.txt
          git commit -m "Update maintenance state"
          git push
